name: v1.0 candidate CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend development dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: python -m ruff check . ../scripts
      - name: Strict mypy
        working-directory: backend
        run: python -m mypy app tests
      - name: Deterministic base tests
        working-directory: backend
        run: python -m pytest -m "not sumo"
      - name: Shared API contract fixtures
        run: python scripts/api_contract_fixtures.py --check

  frontend:
    name: Frontend Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clean frontend install
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Vitest
        working-directory: frontend
        run: npm run test
      - name: Vite production build
        working-directory: frontend
        run: npm run build

  release-metadata:
    name: Release metadata and backend artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend development dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Check release metadata and documentation
        run: python scripts/check_release.py
      - name: Build wheel and source distribution
        working-directory: backend
        run: python -m build --outdir ../release-artifacts
      - name: Validate built artifacts
        run: python scripts/check_release.py --artifacts release-artifacts
      - name: Install and import wheel without source tree
        run: |
          python -m venv "${RUNNER_TEMP}/driveguard-wheel-smoke"
          "${RUNNER_TEMP}/driveguard-wheel-smoke/bin/python" -m pip install --no-deps release-artifacts/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/driveguard-wheel-smoke/bin/python" -c "from app import APP_VERSION; assert APP_VERSION == '1.0.0'"

  deployment-image:
    name: Same-origin deployment image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build production container
        run: docker build --tag driveguard-lab:ci .
      - name: Start production container
        run: docker run --detach --name driveguard-lab-ci --publish 127.0.0.1:18000:10000 driveguard-lab:ci
      - name: Verify public entry point, health, and API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18000/ | grep --quiet '<div id="root">'
          curl --fail --silent http://127.0.0.1:18000/openapi.json | grep --quiet '"version":"1.0.0"'
      - name: Container logs
        if: always()
        run: docker logs driveguard-lab-ci || true
      - name: Stop production container
        if: always()
        run: docker rm --force driveguard-lab-ci || true
